name: Scrape Facebook Reels and Upload to Mega

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: "Facebook page URL"
        default: "https://www.facebook.com/profile.php?id=61596271422824"
      max_scrolls:
        description: "Max scroll iterations"
        default: "60"
      mega_folder:
        description: "Mega destination folder"
        default: "FB_Reels"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FB_STATE: ${{ secrets.FB_STATE }}
      MEGA_FOLDER: ${{ github.event.inputs.mega_folder || 'FB_Reels' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright yt-dlp
          playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone (from secret)
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf

      - name: Restore login session (optional)
        if: ${{ env.FB_STATE != '' }}
        run: echo "$FB_STATE" > fb_state.json

      - name: Scrape reel URLs
        env:
          PAGE_URL: ${{ github.event.inputs.page_url || 'https://www.facebook.com/profile.php?id=61596271422824' }}
          MAX_SCROLLS: ${{ github.event.inputs.max_scrolls || '60' }}
        run: python scrape_reels.py

      - name: Download new reels and upload to Mega
        run: |
          mkdir -p videos
          rclone lsf "mega:$MEGA_FOLDER" > existing.txt || true
          while read -r url; do
            id=$(basename "$url")
            if grep -q "^$id\." existing.txt; then
              echo "Skip $id (already on Mega)"; continue
            fi
            echo "Downloading $url"
            yt-dlp -f "bv*+ba/b" --merge-output-format mp4 \
              -o "videos/$id.%(ext)s" "$url" \
              || { echo "Failed: $url"; continue; }
            sleep 5
          done < reels_urls.txt
          ls -lh videos || true
          if [ -n "$(ls -A videos 2>/dev/null)" ]; then
            rclone copy videos "mega:$MEGA_FOLDER" --transfers 2 -v
          else
            echo "Nothing new to upload"
          fi
